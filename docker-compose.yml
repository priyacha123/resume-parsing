version: '3.9'

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      - redis
    expose:
      - "8000"

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./media:/app/media
    depends_on:
      - web