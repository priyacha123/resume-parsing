services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    env_file: .env
    expose:
      - "8000"

  celery_worker:
    profiles: ["worker"]
    build: .
    command: celery -A config worker --loglevel=info --concurrency=3 --hostname=celery@%h
    volumes:
      - ./logs:/app/logs
    env_file: .env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./media:/app/media
    depends_on:
      - web